<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ElevenLabs Contact Sales Form</title>
</head>
<body style="display: flex; flex: 1; flex-direction: row; margin: 0; padding: 0;">

    <div id="Contents" style="background-color: rgb(37, 37, 37); color: white; width: 100vw; height: 100vh;">

        <img src="elevenlabs-logo-white.svg" alt="ElevenLabs logo" width="100px" height="100px">
        <h1>Contact our sales team</h1>

        <div class="feature-list">
            <div class="feature">
                <img src="rocket.svg" alt="Pricing">
                <p>Custom pricing and elevated concurrency</p>
            </div>
            <div class="feature">
                <img src="shield.svg" alt="Security">
                <p>Enterprise-grade security including SOC II, GDPR and HIPAA compliance</p>
            </div>
            <div class="feature">
                <img src="enterprise.svg" alt="Enterprise">
                <p>Enterprise support and SLAs</p>
            </div>
        </div>

        <p class="trusted-text">Trusted by 10,000+ leading businesses</p>

        <div class="company-logos">
            <img src="cisco.png" alt="Cisco">
            <img src="deutsche-telekom-1.svg" alt="Deutsche Telekom">
            <img src="walt-disney.svg" alt="Disney">
            <img src="nvidia.png" alt="NVIDIA">
            <img src="salesforce.png" alt="Salesforce">
        </div>

        <div class="review">
            <div class="stars">
                <img src="star.png" alt="Star">
                <img src="star.png" alt="Star">
                <img src="star.png" alt="Star">
                <img src="star.png" alt="Star">
                <img src="star.png" alt="Star">
            </div>

            <p>4.5 stars and 1,059+ reviews</p>
        </div>
    </div>

    <div id="Contents" style="background-color: white; color: black; width: 100vw; height: 100vh;">
       Hi 
    </div>

</body>
</html>
