<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>ElevenLabs Contact Sales Form</title>
</head>

<body>

    <section class="sales-panel">

        <img
            class="logo"
            src="elevenlabs-logo-white.svg"
            alt="ElevenLabs logo"
        >

        <h1>Contact our sales team</h1>

        <div class="feature-list">

            <div class="feature">
                <img src="rocket.svg" alt="">
                <p>Custom pricing and elevated concurrency</p>
            </div>

            <div class="feature">
                <img src="shield.svg" alt="">
                <p>Enterprise-grade security including SOC II, GDPR and HIPAA compliance</p>
            </div>

            <div class="feature">
                <img src="enterprise.svg" alt="">
                <p>Enterprise support and SLAs</p>
            </div>

        </div>

        <p class="trusted-text">
            Trusted by 10,000+ leading businesses
        </p>

        <div class="company-logos">
            <img src="cisco.png" alt="Cisco">
            <img src="deutsche-telekom-1.svg" alt="Deutsche Telekom">
            <img src="walt-disney.svg" alt="Disney">
            <img src="nvidia.png" alt="NVIDIA">
            <img src="salesforce.png" alt="Salesforce">
        </div>

        <div class="review">

            <div class="stars">
                <img src="star.png" alt="">
                <img src="star.png" alt="">
                <img src="star.png" alt="">
                <img src="star.png" alt="">
                <img src="star.png" alt="">
            </div>

            <p>4.5 stars and 1,059+ reviews</p>

        </div>

        <img class="bottom-image" src="bottom-waves.png" alt="waves image">

    </section>


    <section class="form-panel">

        <div class="form-container">

            <div class="form-header">
                <h1>Contact sales form</h1>

                <p>
                    Please fill out the form below to get started
                </p>
            </div>


            <form class="sales-form">

                <div class="form-field">
                    <label for="company-website">
                        Company Website
                    </label>

                    <input
                        id="company-website"
                        type="text"
                        name="company-website"
                    >
                </div>


                <div class="form-field">
                    <label for="business-email">
                        Business Email
                    </label>

                    <input
                        id="business-email"
                        type="email"
                        name="business-email"
                    >
                </div>

            </form>


            <div class="form-footer">

                <button class="button" type="button">
                    Next
                </button>

                <div class="progress-bar">
                    <img class="active" src="dash.png" alt="">
                    <img src="dash.png" alt="">
                    <img src="dash.png" alt="">
                </div>

            </div>

        </div>

    </section>

</body>

</html>
